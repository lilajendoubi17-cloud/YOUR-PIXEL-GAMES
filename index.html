<script>
const rooms=document.getElementById('rooms');
const mode=document.getElementById('mode');
const girl=document.getElementById('girl');
const bubble=document.getElementById('bubble');
let objectMode=false;
let dragging=null,startX=0,startY=0,moved=false;
let line=0,timer=null;
const messages=[
"J’ai passé une très bonne journée.",
"Je suis heureuse de te voir.",
"La nuit est le meilleur moment de la journée, tu trouves pas ?",
"Nous deux, on forme une très bonne équipe.",
"C’est super de se revoir."
];

function goRoom(n){
rooms.scrollTo({left:n*innerWidth,behavior:'smooth'});
}
function toggleMode(){
objectMode=!objectMode;
mode.textContent=objectMode?'✕':'🪑';
}

document.querySelectorAll('.pixel').forEach(item=>{
item.addEventListener('pointerdown',e=>{
if(!objectMode)return;
dragging=item;moved=false;
startX=e.clientX;startY=e.clientY;
item.setPointerCapture(e.pointerId);
});
item.addEventListener('pointermove',e=>{
if(dragging!==item)return;
let dx=e.clientX-startX,dy=e.clientY-startY;
if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
const room=item.closest('.room');
const r=room.getBoundingClientRect();
let left=item.offsetLeft+dx,top=item.offsetTop+dy;
item.style.left=Math.max(0,Math.min(r.width-item.offsetWidth,left))+'px';
item.style.top=Math.max(0,Math.min(r.height-item.offsetHeight,top))+'px';
startX=e.clientX;startY=e.clientY;
});
item.addEventListener('pointerup',()=>{if(dragging===item)dragging=null});
});

girl.addEventListener('pointerdown',e=>{
if(objectMode)return;
dragging=girl;moved=false;
startX=e.clientX;startY=e.clientY;
girl.setPointerCapture(e.pointerId);
});
girl.addEventListener('pointermove',e=>{
if(dragging!==girl)return;
let dx=e.clientX-startX,dy=e.clientY-startY;
if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
const room=girl.closest('.room');
let left=girl.offsetLeft+dx,top=girl.offsetTop+dy;
girl.style.left=Math.max(0,Math.min(room.clientWidth-girl.offsetWidth,left))+'px';
girl.style.top=Math.max(0,Math.min(room.clientHeight-girl.offsetHeight,top))+'px';
startX=e.clientX;startY=e.clientY;
});
girl.addEventListener('pointerup',()=>{
if(dragging===girl){
dragging=null;
if(!moved&&!objectMode)sayNext();
}
});

function sayNext(){
clearInterval(timer);
bubble.style.display='block';
const message=messages[line%messages.length];
line++;
let i=0;bubble.textContent='';
timer=setInterval(()=>{
bubble.textContent+=message[i]||'';
i++;
if(i>message.length){
clearInterval(timer);
setTimeout(()=>bubble.style.display='none',2200);
}
},42);
}
</script>
